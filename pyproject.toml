[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "millenniumweb"
authors = [ { name = "FinByz" } ]
description = "External storage integration for Frappe"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]          # ← now inside [project]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.flit.module]
name = "millenniumweb"